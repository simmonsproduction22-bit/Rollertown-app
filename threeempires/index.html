<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Three Empires">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="application-name" content="Three Empires">
<link rel="apple-touch-icon" sizes="180x180" href="/threeempires/apple-touch-icon.png?v=2">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="/threeempires/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="48x48" href="/threeempires/favicon-48.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/threeempires/icon-192.png?v=2">
<link rel="manifest" href="/threeempires/manifest.webmanifest?v=2">
<style>#nl-badge-frame,.nl-badge{display:none!important}</style>
<meta name="description" content="Three Empires Brewing Co. app concept: beers, weekly events, hours and directions.">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Three Empires App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell in Three Empires' brand (black wordmark, hop green roundel). White canvas, real photography first, rewards up top, hairlines instead of boxes. */
:root{
  --bg:#ffffff; --soft:#f5f3ef; --line:#e8e4dd; --ink:#121212; --muted:#68645d;
  --gold:#6ab333; --gold-ink:#3a7516; --on-gold:#121212; --navy:#1f3a14;
  --ok:#2c7a4b; --ok-bg:#e5f2ea; --rose:#b3324e;
  --show-ink:block; --show-white:none; --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.07);
  --display:"Anton","Oswald",Impact,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Onest",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c0c0c;--soft:#181818;--line:#2a2927;--ink:#f4f1eb;--muted:#a39e95;--gold:#77c240;--gold-ink:#9ad866;--on-gold:#121212;--navy:#1f3a14;--ok:#73c996;--ok-bg:#16291e;--rose:#e6829a;--show-ink:none;--show-white:block;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c0c0c;--soft:#181818;--line:#2a2927;--ink:#f4f1eb;--muted:#a39e95;--gold:#77c240;--gold-ink:#9ad866;--on-gold:#121212;--navy:#1f3a14;--ok:#73c996;--ok-bg:#16291e;--rose:#e6829a;--show-ink:none;--show-white:block;--shadow:none}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img{display:block}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
h1{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:.01em;text-transform:uppercase}
h2{font-family:var(--display);font-size:23px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:baseline;gap:10px}
h2 .more{margin-left:auto;font-family:var(--body);font-size:14px;font-weight:600;color:var(--gold-ink);background:none;border:0;padding:6px 0;white-space:nowrap}
h3{font-size:16px;font-weight:600;line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.label{font-family:var(--label);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.small{font-size:13px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:8px;height:58px}
.logo{height:30px;width:auto}
.logo.ink{display:var(--show-ink)}.logo.white{display:var(--show-white)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0;position:relative;flex:0 0 auto}
.ibtn svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn .dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px var(--bg)}
.avatar{width:38px;height:38px;border-radius:50%;border:0;background:#121212;color:#77c240;font-family:var(--display);font-size:18px;display:grid;place-items:center;padding:0;flex:0 0 auto}
.ptpill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px 5px 5px;font-weight:600;font-size:14px}
.ptpill img{width:26px;height:26px}

.joinbtn{border:0;background:var(--gold);color:var(--on-gold);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.joincard{position:relative;overflow:hidden;background:#121212;color:#f4f1eb;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.joincard .badge{position:absolute;right:-30px;top:-30px;width:140px;height:140px;opacity:.18}
.joincard h2{color:#f4f1eb;font-size:30px}
.joincard p{color:#cfc8bb;font-size:14px;max-width:30ch}
.joincard .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.joincard .link{border:0;background:none;color:#77c240;font-weight:600;font-size:14px;padding:8px 4px}
.perks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.perks .c{display:flex;flex-direction:column;gap:6px}
.perks .im{aspect-ratio:1;max-width:100%;border-radius:16px;overflow:hidden;background:#121212;display:grid;place-items:center}
.perks .im img{width:100%;height:100%;object-fit:cover}
.perks .im.b img{width:55%;height:auto;object-fit:contain}
.perks p{font-size:13px;color:var(--muted)}
.cta{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--soft);border-radius:16px;padding:12px 14px;border:0;width:100%;text-align:left}
.cta img{width:40px;height:40px}
.cta span.s{font-size:13px;color:var(--muted)}
.demobar{background:#121212;color:#cfc8bb;font-size:12px}
.demobar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
.demobar b{color:#77c240;font-weight:600}
.demobar button{border:1px solid #3a3734;background:none;color:#f4f1eb;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
.demobar button.arm{background:#77c240;border-color:#77c240;color:#121212}
/* center Rewards tab logo: light lettering in dark mode */
nav.tabs .mid img.rl.ink{display:var(--show-ink)}
nav.tabs .mid img.rl.white{display:var(--show-white)}
/* points pill: always white */
/* lock page width: nothing can push the app wider than the screen */
html,body{overflow-x:clip;max-width:100%}
@supports not (overflow-x:clip){body{overflow-x:hidden}}
main,.view,.view>*{min-width:0;max-width:100%}
.view{overflow-wrap:break-word}
.show{grid-template-columns:118px minmax(0,1fr)}
.fb{grid-template-columns:90px minmax(0,1fr)}

/* home-screen app: no zoom, no input auto-zoom */
html.standalone,html.standalone body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
html.standalone input,html.standalone select,html.standalone textarea{font-size:16px!important}

/* in-app ticket checkout */
.sheet[data-order="tix"]{height:92%;padding:0;gap:0;overflow:hidden}
.sheet[data-order="tix"] .grab{margin:8px auto 0}
.tixhead{display:flex;align-items:center;gap:10px;padding:8px 14px 10px;border-bottom:1px solid var(--line)}
.tixhead .t{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.tixhead .t b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tixhead .t span{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.tixhead .t span svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.tixframe{position:relative;flex:1;background:#fff}
.tixframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.tixload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#68645d;font-size:14px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid #e8e4dd;border-top-color:#77c240;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tixfoot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center}
.tixfoot .linkbtn{border:0;background:none;padding:0;color:var(--gold-ink);font-weight:600;font-size:13px}

/* small brand marks: same treatment as the Rewards tab (badge on a page-colored disc, light lettering in dark mode) */
.ptpill .pw,.rbadge{border-radius:50%;background:var(--bg)!important;display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.ptpill .pw{width:30px;height:30px}
.ptpill .pw img,.rbadge img{width:100%!important;height:100%!important;filter:none}
.ptpill .pw img.ink,.rbadge img.ink{display:var(--show-ink)}
.ptpill .pw img.white,.rbadge img.white{display:var(--show-white)}
.ptpill{padding-left:3px!important}
.rbadge{box-shadow:0 0 0 3px var(--rc),0 2px 8px rgba(0,0,0,.18)!important}
.rcard .rk .rbadge{background:transparent!important;box-shadow:none!important}
.rcard .rk .rbadge img.ink{display:none}
.rcard .rk .rbadge img.white{display:block}
.rbadge.locked{box-shadow:0 0 0 2px var(--line)!important;opacity:1}
.rbadge.locked img{filter:grayscale(1);opacity:.35}
/* what's happening: compact banner */
.hcard{aspect-ratio:auto!important;height:168px}
.hcards.two .hcard{height:200px}
.hcards:not(.two) .hcard .fgp,.hcards:not(.two) .hcard .hzb{left:auto;right:14px;top:14px;transform:none;height:calc(100% - 28px);max-width:40%}
.hcards:not(.two) .hcard.poster .shade,.hcards:not(.two) .hcard.badge .shade{background:linear-gradient(to right,rgba(0,0,0,.75) 0%,rgba(0,0,0,.35) 55%,rgba(0,0,0,0) 75%)}
.hcards:not(.two) .hcard.poster .cap,.hcards:not(.two) .hcard.badge .cap{right:42%;top:0;justify-content:center}
.hcards:not(.two) .hcard b{font-size:26px}
.hcards.two .hcard .fgp,.hcards.two .hcard .hzb{top:10px;height:44%}
.hcards.two .hcard b{font-size:21px}
.hcards.two .hcard .s{font-size:12px}
.hcard .go{margin-top:4px;padding:5px 10px}


/* today */
.dstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dchip{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.dchip small{font-family:var(--label);font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.dchip b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1}
.dchip i{width:5px;height:5px;border-radius:50%;background:transparent}
.dchip i.on{background:var(--gold)}
.dchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dchip[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.tcard{position:relative;display:block;width:100%;aspect-ratio:16/10;max-width:100%;border:0;padding:0;border-radius:22px;overflow:hidden;background:#121212;text-align:left;color:#fff}
.tcard .bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tcard:has(.fgp) .bgi{filter:blur(18px) brightness(.55);transform:scale(1.2)}
.tcard .fgp{position:absolute;right:14px;top:14px;height:62%;width:auto;max-width:46%;object-fit:contain;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tcard .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.25) 55%,rgba(0,0,0,0) 100%)}
.tcard .cap{position:absolute;left:0;right:0;bottom:0;padding:16px;display:flex;flex-direction:column;gap:4px}
.tcard .k{font-family:var(--label);font-size:13px;font-weight:700;letter-spacing:.14em;color:#77c240}
.tcard b{font-family:var(--display);font-weight:400;font-size:34px;line-height:.95;color:#fff}
.tcard .s{font-size:14px;color:rgba(255,255,255,.85)}
.tlist{display:flex;flex-direction:column}
.ti{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.ti:last-child{border-bottom:0}
.ti:disabled{cursor:default;opacity:1;color:inherit}
.ti .ic{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.ti .ic svg{width:20px;height:20px;stroke:var(--gold-ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ti .t{display:flex;flex-direction:column;gap:1px;min-width:0}
.ti .t b{font-weight:600;font-size:15px}
.ti .t span{font-size:13px;color:var(--muted)}
.ti svg.chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
/* ranks */
.rbadge{display:inline-grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--rc),0 0 0 5px rgba(0,0,0,.08);flex:0 0 auto;overflow:hidden}
.rbadge img{width:86%;height:86%}
.rbadge.locked{filter:grayscale(1);opacity:.4;box-shadow:0 0 0 2px var(--line)}
.rcard .rk{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;color:#f4f1eb;font-family:var(--label);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-align:left}
.rcard .rk em{font-style:normal;font-family:var(--body);font-size:12px;letter-spacing:0;text-transform:none;color:#a39e95;margin-left:auto}
.rhero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--rc) 22%,var(--bg)) 0%,var(--soft) 70%)}
.rhero .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.rbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.rbar i{display:block;height:100%;background:var(--rc);border-radius:4px}
.ladder{display:flex;flex-direction:column;gap:2px}
.rung{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px;border-radius:16px}
.rung.cur{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--gold)}
.rung .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.rung .t b{font-weight:600}
.rung .perks{font-size:13px;color:var(--ink)}
.rung.off .perks,.rung.off b{color:var(--muted)}
.board{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.brow{display:grid;grid-template-columns:22px auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow.me{background:var(--soft)}
.brow .pos{font-family:var(--display);font-size:22px;color:var(--gold-ink);text-align:center}
.brow .nm{display:flex;flex-direction:column;font-weight:600;min-width:0}
.brow .nm small{font-weight:500;font-size:12px;color:var(--muted)}
.brow .pts{font-weight:600;font-variant-numeric:tabular-nums}
.rankup{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:24px 0 6px;overflow:hidden}
.rankup h1{font-size:40px}
.rankup .perks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.rankup .perks span{background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-10px;left:var(--x);width:8px;height:12px;background:var(--c);border-radius:2px}
@media (prefers-reduced-motion:no-preference){.confetti i{animation:fall 1.6s var(--d) ease-in forwards}@keyframes fall{to{transform:translateY(260px) rotate(540deg);opacity:0}}}
/* cocktails */
.flightc{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;background:#121212;color:#f4f1eb;border-radius:20px;overflow:hidden}
.flightc img{width:110px;height:140px;object-fit:cover}
.flightc h2{color:#f4f1eb}
.flightc p{font-size:13px;color:#cfc8bb;padding-right:12px}
.cc .im{position:relative;aspect-ratio:4/5}
.cc .ctag{position:absolute;left:8px;top:8px;background:#fff;color:#121212;font-size:11px;font-weight:700;border-radius:999px;padding:4px 9px}
.cc p i{color:var(--muted)}
.dart{display:grid;place-items:center;width:100%;height:100%;background:radial-gradient(120% 90% at 50% 100%,color-mix(in srgb,var(--dc) 55%,#121212) 0%,#121212 70%)}
.dart svg{width:56%;height:auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
/* mueller ordering */
.mwst{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:start;border-radius:14px;padding:12px 14px;background:var(--ok-bg)}
.mwst .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);margin-top:5px}
.mwst div{display:flex;flex-direction:column;gap:2px}
.mwst b{font-size:14px}
.mwst span{font-size:13px;color:var(--muted)}
.mwst.busy{background:color-mix(in srgb,var(--gold) 18%,var(--bg))}.mwst.busy .dot{background:var(--gold)}
.mwst.paused{background:color-mix(in srgb,var(--rose) 14%,var(--bg))}.mwst.paused .dot{background:var(--rose)}
.mwst.later{background:var(--soft)}.mwst.later .dot{background:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slots button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.slots button b{font-size:14px;font-variant-numeric:tabular-nums}
.slots button small{font-size:11px;color:var(--muted)}
.slots button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.slots button[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.slots button:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:999px;padding:4px}
.seg3 button{border:0;background:none;border-radius:999px;padding:10px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.seg3 button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* what's happening: home cards */
.hcards{display:grid;gap:10px}
.hcards.two{grid-template-columns:1fr 1fr}
.hcard{position:relative;display:block;width:100%;aspect-ratio:16/11;max-width:100%;border:0;padding:0;border-radius:20px;overflow:hidden;background:#121212;text-align:left;color:#fff}
.hcards.two .hcard{aspect-ratio:3/4}
.hcard.badge{background:radial-gradient(120% 90% at 50% 20%,#2f5a1d 0%,#0f1d0a 70%)}
.hcard .hzb{position:absolute;left:50%;top:10%;transform:translateX(-50%);height:52%;width:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.hcard .bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(16px) brightness(.5);transform:scale(1.2)}
.hcard .bgi.sharp{filter:none;transform:none}
.hcard .fgp{position:absolute;left:50%;top:8%;transform:translateX(-50%);height:56%;width:auto;max-width:86%;object-fit:contain;border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.55)}
.hcard .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,0) 70%)}
.hcard .cap{position:absolute;left:0;right:0;bottom:0;padding:14px;display:flex;flex-direction:column;gap:3px}
.hcard .k{font-family:var(--label);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#77c240}
.hcard b{font-family:var(--display);font-weight:400;font-size:28px;line-height:.95;color:#fff;text-wrap:balance}
.hcards.two .hcard b{font-size:23px}
.hcard .s{font-size:13px;color:rgba(255,255,255,.82)}
.hcard .go{margin-top:6px;align-self:flex-start;background:#77c240;color:#121212;font-weight:600;font-size:12px;border-radius:999px;padding:6px 11px}
.hfacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hf{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:10px 12px;text-align:left}
.hf .ic{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:0 0 auto}
.hf .ic svg{width:18px;height:18px;stroke:var(--gold-ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hf b{display:block;font-size:14px;font-weight:600}
.hf small{font-size:12px;color:var(--muted)}
/* what's happening: detail pages */
.hz{position:relative;margin:-10px calc(-1*max(20px,env(safe-area-inset-right,0px))) 0;aspect-ratio:16/12;max-width:none;overflow:hidden;background:#121212;color:#fff;flex-shrink:0}
.hz .bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(18px) brightness(.5);transform:scale(1.2)}
.hz .bgi.sharp{filter:none;transform:none}
.hz .fgp{position:absolute;left:50%;top:7%;transform:translateX(-50%);height:62%;width:auto;max-width:84%;object-fit:contain;border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.hz.badge{background:radial-gradient(120% 90% at 50% 20%,#2f5a1d 0%,#0f1d0a 70%)}
.hz .hzb{position:absolute;left:50%;top:8%;transform:translateX(-50%);height:58%;width:auto;filter:drop-shadow(0 10px 22px rgba(0,0,0,.45))}
.hz::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.25) 40%,rgba(0,0,0,0) 65%)}
.hzcap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.hzcap .k{font-family:var(--label);font-size:13px;font-weight:700;letter-spacing:.14em;color:#77c240}
.hzcap h1{color:#fff;font-size:36px}
.ichips{display:flex;flex-wrap:wrap;gap:8px}
.ichip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.ichip svg{width:15px;height:15px;stroke:var(--gold-ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.expect{display:flex;flex-direction:column}
.ex{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;padding:8px 0;font-size:14px}
.ex .ic{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.ex .ic svg{width:17px;height:17px;stroke:var(--gold-ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spec{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:#121212;color:#f4f1eb;border-radius:18px;overflow:hidden}
.spec img{width:96px;height:100%;min-height:130px;object-fit:cover}
.spec .t{display:flex;flex-direction:column;gap:4px;padding:12px 12px 12px 0}
.spec .t b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1}
.spec .t span{font-size:13px;color:#cfc8bb}
.spec .btn{align-self:flex-start;margin-top:4px}
.ndates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.nd{border:1px solid var(--line);border-radius:14px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
.nd small{font-family:var(--label);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.nd b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.nd.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.nd.on small{color:var(--bg);opacity:.75}
.mtrucks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mtrucks button{border:0;background:none;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left;font-size:12px;font-weight:600}
.mtrucks img{width:100%;aspect-ratio:1;max-width:100%;object-fit:cover;border-radius:14px}
.tixbar{display:flex;flex-direction:column;gap:6px;text-align:center}
.exitbtn{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600}
main{padding-block:20px calc(104px + env(safe-area-inset-bottom,0px))}
section.view{display:flex;flex-direction:column;gap:34px}
@media (prefers-reduced-motion:no-preference){section.view{animation:in .22s ease-out}@keyframes in{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* rewards card (brand black in both themes) */
.rcard{position:relative;overflow:hidden;background:#121212;color:#f4f1eb;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px}
.rcard .badge{position:absolute;right:-34px;top:-34px;width:150px;height:150px;opacity:.16}
.rcard .lbl{font-family:var(--label);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#cfc8bb}
.rcard .bal{display:flex;align-items:baseline;gap:8px}
.rcard .bal b{font-family:var(--display);font-weight:400;font-size:58px;line-height:.85;color:#77c240}
.rcard .bal span{font-family:var(--label);font-size:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#cfc8bb}
.track{position:relative;height:6px;background:#2d2b28;border-radius:3px;margin:16px 0 22px}
.track i{position:absolute;left:0;top:0;bottom:0;background:#77c240;border-radius:3px}
.track .mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:#2d2b28;border:2px solid #121212}
.track .mk.hit{background:#77c240}
.track .mk span{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:#a39e95;white-space:nowrap}
.track .mk.hit span{color:#77c240}
.rcard .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rbtn{border:0;border-radius:999px;padding:12px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.rbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rbtn.gold{background:#77c240;color:#121212}
.rbtn.line{background:transparent;color:#f4f1eb;box-shadow:inset 0 0 0 1.5px #4a4743}
.rcard .meta{display:flex;justify-content:space-between;font-size:13px;color:#a39e95;gap:8px}

/* photos */
.photo{position:relative;border-radius:20px;overflow:hidden;background:var(--soft)}
.photo>img{width:100%;height:100%;object-fit:cover}
.photo .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,rgba(0,0,0,.2) 55%,rgba(0,0,0,0) 100%)}
.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:16px;color:#fff;display:flex;flex-direction:column;gap:6px}
.photo .cap h1,.photo .cap h2{color:#fff}
.photo .cap p{color:rgba(255,255,255,.85);font-size:14px}
.visit{aspect-ratio:16/10;max-width:100%}
.banner{aspect-ratio:16/8;max-width:100%}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok);width:max-content}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.off{background:var(--soft);color:var(--muted)}
.photo .status{background:rgba(255,255,255,.95);color:#1d6a3e}
.photo .status.off{color:#555}
.ghostbtn{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.95);color:#121212;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;text-decoration:none;border:0}

.statusline{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left;color:var(--muted);font-size:14px}
.statusline .addr{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statusline svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;flex:0 0 auto;margin-left:-4px}
.tapc{flex:0 0 31%;max-width:132px;scroll-snap-align:start;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px}
.tapc img{width:100%;aspect-ratio:1;max-width:100%;border-radius:14px;object-fit:cover;box-shadow:var(--shadow)}
.tapc h3{font-size:14px}
.tapc span{font-size:12px}
.mini .im{position:relative}
.mini .pill{position:absolute;right:8px;bottom:8px;background:#fff;color:#121212;font-size:12px;font-weight:600;border-radius:999px;padding:5px 10px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
/* tonight */
.tonight{display:grid;grid-template-columns:132px 1fr;background:#121212;color:#f4f1eb;border-radius:20px;overflow:hidden;border:0;padding:0;text-align:left;width:100%}
.tonight img{width:132px;height:100%;min-height:172px;object-fit:cover}
.tonight .in{padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tonight .k{font-family:var(--label);font-size:13px;font-weight:700;letter-spacing:.14em;color:#77c240}
.tonight h2{color:#f4f1eb}
.tonight p{font-size:13px;color:#cfc8bb}
.tonight .go{margin-top:auto;display:inline-flex;align-self:flex-start;background:#77c240;color:#121212;font-weight:600;font-size:13px;border-radius:999px;padding:8px 14px}

/* happy hour */
.hh{display:grid;grid-template-columns:1fr 96px;gap:12px;align-items:center;background:var(--soft);border-radius:20px;overflow:hidden;padding:0 0 0 16px}
.hh img{width:96px;height:118px;object-fit:cover}
.hh .t{display:flex;flex-direction:column;gap:4px;padding-block:14px}

/* quick links */
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.qa{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;padding:4px 0;text-align:center}
.qa span.ic{width:56px;height:56px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.qa svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* rails */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 4px;scrollbar-width:none}
.rail{scroll-padding-inline:16px}
.sheet>*{flex-shrink:0}
.rail::-webkit-scrollbar{display:none}
.feat{flex:0 0 72%;max-width:300px;scroll-snap-align:start;display:flex;flex-direction:column;gap:9px;border:0;background:none;padding:0;text-align:left}
.feat .im{aspect-ratio:4/3;max-width:100%;border-radius:16px;overflow:hidden;background:var(--soft);position:relative}
.feat .im.tall{aspect-ratio:4/4.4}
.feat .im img{width:100%;height:100%;object-fit:cover}
.feat .im.brand{background:#121212;display:grid;place-items:center}
.feat .im.brand img{width:46%;height:auto;object-fit:contain}
.feat .k{font-family:var(--label);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
.feat p{font-size:14px;color:var(--muted)}
.mini{flex:0 0 44%;max-width:200px;scroll-snap-align:start;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px}
.mini .im{aspect-ratio:1;max-width:100%;border-radius:16px;overflow:hidden}
.mini img{width:100%;height:100%;object-fit:cover}

/* rows */
.rows{display:flex;flex-direction:column}
.r{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border:0;border-bottom:1px solid var(--line);text-align:left;background:none;width:100%}
.r:last-child{border-bottom:0}
.r .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.r .t span{font-size:13px;color:var(--muted)}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:0 0 auto}
.thumb.p{width:52px;height:66px;border-radius:8px}
.date{width:48px;text-align:center;line-height:1}
.date small{display:block;font-family:var(--label);font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--gold-ink)}
.date b{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:.95}
.date em{display:block;font-style:normal;font-size:11px;color:var(--muted);font-weight:600}

/* buttons */
.btn{border:0;background:var(--ink);color:var(--bg);font-weight:600;padding:13px 18px;border-radius:999px;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;font-family:var(--label);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.tag.ok{color:var(--ok)}.tag.mut{color:var(--muted)}.tag.rose{color:var(--rose)}

/* menu */
.tabsline{display:flex;gap:24px;border-bottom:1px solid var(--line)}
.tabsline button{border:0;background:none;padding:10px 0 12px;font-weight:600;font-size:15px;color:var(--muted);position:relative}
.tabsline button[aria-pressed="true"]{color:var(--ink)}
.tabsline button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--gold);border-radius:2px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:999px;padding:4px}
.seg2 button{border:0;background:none;border-radius:999px;padding:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lab{width:56px;height:56px;border-radius:12px;overflow:hidden;background:var(--soft);display:grid;place-items:center;flex:0 0 auto}
.lab img{width:100%;height:100%;object-fit:cover}
.lab svg{width:44%;height:auto}
.abv{text-align:right;display:flex;flex-direction:column;gap:1px}
.abv b{font-weight:600;font-variant-numeric:tabular-nums}
.abv span{font-size:12px;color:var(--muted)}
.r.out{opacity:.45}
.rate{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.rate svg{width:12px;height:12px;fill:var(--gold);stroke:none}
.src{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.src b{color:var(--ink);font-weight:600}
.src .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--soft);border:0;border-radius:999px;padding:12px 16px;font:inherit;font-size:16px;color:var(--ink)}
.search select{background:var(--soft);border:0;border-radius:999px;padding:0 14px;font:inherit;font-size:14px;color:var(--ink)}
.vaulthd{background:#121212;color:#f4f1eb;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.vaulthd h1{color:#77c240}
.vaulthd p{color:#cfc8bb;font-size:14px}
.vaulthd .dial{position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;border:10px solid #2d2b28;box-shadow:inset 0 0 0 14px #121212,inset 0 0 0 18px #2d2b28}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.cc{display:flex;flex-direction:column;gap:8px}
.cc .im{aspect-ratio:3/4;max-width:100%;border-radius:16px;overflow:hidden;background:#121212}
.cc img{width:100%;height:100%;object-fit:cover}
.cc p{font-size:13px;color:var(--muted)}
.cc:last-child:nth-child(odd){grid-column:1/-1}
.cc:last-child:nth-child(odd) .im{aspect-ratio:16/9}
.truck{display:flex;flex-direction:column;gap:12px}
.truck .im{aspect-ratio:3/2;max-width:100%;border-radius:16px;overflow:hidden}
.truck .im img{width:100%;height:100%;object-fit:cover}
.truck .hd{display:flex;align-items:baseline;gap:10px}
.truck .hd h2{flex:1;min-width:0}
.pair{display:flex;align-items:center;gap:10px;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--soft);border:0;width:100%;text-align:left}
.divider{height:1px;background:var(--line)}
.tmenu{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tmenu summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;font-weight:600}
.tmenu summary::-webkit-details-marker{display:none}
.tmenu summary .chev{margin-left:auto;transition:transform .15s}
.tmenu[open] summary .chev{transform:rotate(90deg)}
.tmenu summary svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.tmenu .body{padding:0 14px 8px;display:flex;flex-direction:column}
.tsec{font-family:var(--label);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 0 4px}
.titem{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.titem.ph{grid-template-columns:1fr 84px}
.titem .tx{display:grid;grid-template-columns:1fr auto;gap:2px 12px;min-width:0}
.titem.ph .tx{grid-template-columns:1fr}
.titem img{width:84px;height:84px;border-radius:12px;object-fit:cover}
.thero{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/8;max-width:100%;margin:2px 0 6px;background:#121212}
.thero img{width:100%;height:100%;object-fit:cover}
.thero span{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;color:#fff;font-size:13px;font-weight:600;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,0))}
.titem:last-child{border-bottom:0}
.titem b{font-weight:600}
.titem span.d{grid-column:1/-1;font-size:13px;color:var(--muted)}
.titem .pr{font-variant-numeric:tabular-nums;font-weight:600}
.titem.so b,.titem.so .pr{color:var(--muted);text-decoration:line-through}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0 14px 12px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync i.man{background:var(--gold)}
.edrow{display:grid;grid-template-columns:1fr 92px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.edrow input{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:9px 10px;border-radius:10px;font:inherit;font-size:15px;width:100%;min-width:0}

svg.glass{width:34px;height:46px;flex:0 0 auto}

/* events */
.show{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:stretch;border:0;background:none;padding:0;text-align:left;width:100%}
.show img{width:118px;aspect-ratio:436/469;height:auto;border-radius:12px;object-fit:cover;box-shadow:var(--shadow)}
.show .t{display:flex;flex-direction:column;gap:4px;min-width:0;padding-block:2px}
.show .t span{font-size:13px;color:var(--muted)}
.show .acts{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.up{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.up .im{aspect-ratio:5/4;max-width:100%;border-radius:16px;overflow:hidden}
.up img{width:100%;height:100%;object-fit:cover}
.up .c{display:flex;flex-direction:column;gap:6px}
.up p{font-size:13px;color:var(--muted)}
.fb{display:grid;grid-template-columns:90px 1fr;gap:14px;align-items:center;background:var(--navy);color:#fff;border-radius:20px;padding:16px}
.fb img{width:90px;height:auto}
.fb h2{color:#fff}
.fb p{font-size:14px;color:rgba(255,255,255,.82)}
.tix{display:grid;grid-template-columns:64px 1fr auto;background:#121212;color:#f4f1eb;border-radius:18px;overflow:hidden;border:0;text-align:left;width:100%;padding:0;align-items:stretch}
.tix img{width:64px;height:100%;object-fit:cover}
.tix .main{padding:14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tix .main b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1;color:#f4f1eb}
.tix .main span{font-size:12px;color:#cfc8bb}
.tix .stub{width:78px;border-left:2px dashed #3a3734;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;position:relative;background:#1a1918}
.tix .stub::before,.tix .stub::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.tix .stub::before{top:-8px}.tix .stub::after{bottom:-8px}
.tix .stub b{font-family:var(--display);font-weight:400;font-size:32px;line-height:.9;color:#77c240}
.tix .stub small{font-family:var(--label);font-size:12px;font-weight:700;letter-spacing:.1em;color:#cfc8bb}

/* rewards */
.earn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.earn button{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:13px;text-align:center;box-shadow:var(--shadow)}
.earn svg{width:26px;height:26px;stroke:var(--gold-ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.auto{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);border-left:0;border-right:0;border-top:0;background:none;width:100%;text-align:left}
.auto:last-child{border-bottom:0}
.auto .ic{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.auto .ic svg{width:20px;height:20px;stroke:var(--gold-ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.auto .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.auto .t span{font-size:13px;color:var(--muted)}
.cost{font-size:13px;color:var(--gold-ink);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pts{font-variant-numeric:tabular-nums;font-weight:600}
.pts.plus{color:var(--ok)}.pts.minus{color:var(--rose)}
.passport{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 10px}
.pp{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px;font-weight:600;line-height:1.15;color:var(--muted);border:0;background:none;padding:0}
.pp .c{width:100%;aspect-ratio:1;max-width:72px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;overflow:hidden}
.pp .c img{width:100%;height:100%;object-fit:cover;filter:grayscale(1);opacity:.35}
.pp .c svg{width:26px;height:34px;opacity:.25}
.pp.got{color:var(--ink)}
.pp.got .c{border:2px solid var(--gold);background:var(--soft)}
.pp.got .c img{filter:none;opacity:1}
.pp.got .c svg{opacity:1}
.voucher{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1.5px dashed var(--gold);border-radius:16px;padding:12px 14px;background:var(--soft);width:100%;text-align:left}
.voucher img{width:34px;height:34px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px;flex:0 0 auto}
.sheet .hero{margin:-10px calc(-1*max(20px,env(safe-area-inset-right,0px))) 0;aspect-ratio:16/10;max-width:none;overflow:hidden;position:relative;background:#121212}
.sheet .hero img{width:100%;height:100%;object-fit:cover}
.sheet .hero.poster{aspect-ratio:auto;display:grid;place-items:center;padding:24px 0 8px;background:#121212}
.sheet .hero.poster img{width:62%;height:auto;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.qr{background:#fff;border-radius:16px;padding:16px;width:230px;max-width:100%;margin:0 auto;border:1px solid var(--line)}
.qr canvas{width:100%;display:block;image-rendering:pixelated}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;padding:2px}
.stars svg{width:32px;height:32px;stroke:var(--gold);stroke-width:1.5;fill:none}
.stars button[aria-pressed="true"] svg{fill:var(--gold)}
.bigglass{display:flex;gap:16px;align-items:center}
.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:14px}
.specs div{padding:12px;text-align:center;border-right:1px solid var(--line)}
.specs div:last-child{border-right:0}
.specs b{display:block;font-family:var(--display);font-weight:400;font-size:28px;line-height:1}
.specs span{font-family:var(--label);font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.desc{font-size:15px;line-height:1.55}
.scan{border:1.5px dashed var(--line);border-radius:18px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;cursor:pointer}
.scan svg.big{width:44px;height:44px;stroke:var(--gold-ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.scan img{max-height:200px;border-radius:10px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.heart{border:1px solid var(--line);background:var(--bg);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;flex:0 0 auto;padding:0}
.heart svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8}
.heart[aria-pressed="true"] svg{fill:var(--rose);stroke:var(--rose)}
.pk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:12px}
.pk b{color:var(--ink);font-weight:700}
.pk svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.tt{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tt img{width:52px;height:52px;border-radius:10px;object-fit:cover}
.tt .t{min-width:0}
.tt .t span{display:block;font-size:12px;color:var(--muted)}
.tt .t b{font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px}
.stepper button{border:0;background:none;width:40px;height:42px;font-size:20px}
.stepper b{min-width:26px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.tot{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:14px;font-variant-numeric:tabular-nums}
.tot .big{font-weight:700;font-size:16px}
.apay{background:#000;color:#fff;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:16px;width:100%}
.apay:disabled{opacity:.35}
.note{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note img{width:52px;height:52px;border-radius:12px;object-fit:cover}
.note .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.note .t span{font-size:13px;color:var(--muted)}
.note.unread h3::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rose);margin-left:6px;vertical-align:middle}
.prof{display:flex;align-items:center;gap:14px}
.prof .avatar{width:64px;height:64px;font-size:28px}
.code{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:12px 14px}
.code b{flex:1;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.06em}
.toggle{width:48px;height:30px;border-radius:15px;background:var(--line);border:0;position:relative;flex:0 0 auto;padding:0}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.toggle[aria-checked="true"]{background:var(--ok)}
.toggle[aria-checked="true"]::after{left:21px}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ok)}
.conn::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

/* book */
.spaces{display:flex;flex-direction:column;gap:12px}
.space{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:8px 14px 8px 8px}
.space img{width:104px;height:84px;object-fit:cover;border-radius:10px}
.space[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.space .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.space .t span{font-size:13px;color:var(--muted)}
.cal{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.cal-hd{display:flex;align-items:center;justify-content:space-between}
.cal-hd b{font-family:var(--display);font-weight:400;font-size:24px}
.cal-nav{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-family:var(--label);font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.day{aspect-ratio:1;min-width:0;border-radius:50%;border:0;background:none;font-size:14px;font-weight:500;padding:0;font-variant-numeric:tabular-nums}
.day:not(:disabled):hover{background:var(--soft)}
.day.full{color:var(--muted);text-decoration:line-through;opacity:.5}
.day.blank{visibility:hidden}
.day:disabled{cursor:default}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:13px 14px;border-radius:12px;font:inherit;font-size:16px;width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper.big button{width:46px;height:48px}
.stepper.big b{flex:1}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.more2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.more2 button,.more2 a{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;text-decoration:none}
.more2 .im{aspect-ratio:4/3;max-width:100%;border-radius:16px;overflow:hidden}
.more2 img{width:100%;height:100%;object-fit:cover}
.more2 p{font-size:13px;color:var(--muted)}

/* visit */
.info{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.info:last-child{border-bottom:0}
.info svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.info b{display:block;font-weight:600;font-size:15px}
.hours{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;margin-top:6px;font-variant-numeric:tabular-nums}
.hours .now{font-weight:700;color:var(--gold-ink)}
.story{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.story .im{border-radius:16px;overflow:hidden;aspect-ratio:1;max-width:100%}
.story img{width:100%;height:100%;object-fit:cover}
.tl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.tl b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--gold-ink);line-height:1}
.foot{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}

/* owner */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--display);font-weight:400;font-size:38px;line-height:.95}
.kpi span{font-size:13px;color:var(--muted)}
.kpi em{font-style:normal;font-size:12px;color:var(--ok);font-weight:600}
.spark{width:100%;height:56px}
.rcpt{width:40px;height:52px;border-radius:6px;background:repeating-linear-gradient(var(--soft) 0 6px,var(--bg) 6px 9px);border:1px solid var(--line)}
.sold{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:6px}
.sold i{display:block;height:100%;background:var(--gold)}
.picks{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.picks button{flex:0 0 auto;border:2px solid transparent;border-radius:12px;padding:0;overflow:hidden;background:none}
.picks button[aria-pressed="true"]{border-color:var(--gold)}
.picks img{width:72px;height:72px;object-fit:cover}
.push{border-radius:16px;padding:12px;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--soft)}
.push>img:first-child{width:40px;height:40px;border-radius:10px;background:#121212;padding:3px}
.push .pi{width:48px;height:48px;border-radius:8px;object-fit:cover}
.push p{font-size:13px;color:var(--muted)}

/* onboarding */
.ob{position:fixed;inset:0;z-index:50;background:#0c0c0c;color:#f4f1eb;overflow-y:auto}
.ob .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.ob .fade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(12,12,12,.25) 0%,rgba(12,12,12,.6) 45%,#0c0c0c 78%)}
.ob .in{position:relative;max-width:480px;min-height:100%;margin:0 auto;padding:max(28px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.ob .word{width:200px;height:auto}
.ob h1{font-size:50px;color:#fff;margin-top:auto}
.ob p{color:#cfc8bb}
.ob .dots{display:flex;gap:6px}
.ob .dots i{flex:1;height:3px;border-radius:2px;background:#3a3734}
.ob .dots i.on{background:#77c240}
.ob .field label{color:#cfc8bb;font-size:13px}
.ob .field input{background:#181818;border-color:#2a2927;color:#f4f1eb}
.ob .perk{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.ob .perk img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.ob .perk span{font-size:13px;color:#a39e95;display:block}
.ob .gbtn{background:#77c240;color:#121212;border:0;border-radius:999px;padding:15px;font-weight:600;font-size:16px;width:100%}
.ob .obline{background:none;border:1.5px solid #4a4743;color:#f4f1eb;border-radius:999px;padding:14px;font-weight:600;font-size:16px;width:100%}
.pwrap{position:relative}
.pwrap input{padding-right:70px}
.pshow{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:#77c240;font-weight:600;font-size:14px;padding:8px 10px}
.ob form{margin:0}
.ob .gbtn:disabled{opacity:.6}
.btn.arm{background:var(--rose);color:#fff;box-shadow:none}
.ob .lbtn{background:none;border:0;color:#cfc8bb;padding:10px;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.ob .err{color:#f19bb0;font-size:14px;font-weight:600}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:10px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{stroke:var(--gold-ink)}
nav.tabs .mid img{width:46px;height:46px;margin-top:-24px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 4px var(--bg),0 2px 10px rgba(0,0,0,.18)}
.browser{margin:-10px calc(-1*max(20px,env(safe-area-inset-right,0px))) 0;display:flex;flex-direction:column}
.bbar{position:sticky;top:-10px;z-index:2;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 16px;background:var(--soft);border-bottom:1px solid var(--line)}
.bbar button{border:0;background:none;font-weight:600;color:#0a63d1;font-size:15px;padding:4px}
.bbar .url{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--ink);background:var(--bg);border-radius:10px;padding:7px 10px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bbar .url svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;flex:0 0 auto}
.site{background:#ffffff;color:#1b1b1b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:60vh;display:flex;flex-direction:column}
.site .shead{padding:18px 16px 14px;color:#fff;display:flex;flex-direction:column;gap:4px}
.site .shead b{font-size:22px;font-weight:800;letter-spacing:-.01em}
.site .shead span{font-size:13px;opacity:.9}
.site .sbody{padding:4px 16px 16px;display:flex;flex-direction:column}
.site h4{margin:16px 0 6px;font-size:16px;font-weight:800;color:#1b1b1b}
.site .si{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 0;border-bottom:1px solid #ececec}
.site .si .n{font-weight:700;font-size:15px}
.site .si .d{font-size:13px;color:#666}
.site .si .pr{font-size:14px;color:#1b1b1b}
.site .sadd{border:1px solid #d0d0d0;background:#fff;color:#1b1b1b;border-radius:999px;width:36px;height:36px;font-size:20px;line-height:1;padding:0}
.site .sq{display:flex;align-items:center;gap:8px;font-weight:700;color:#1b1b1b}
.site .sq button{border:1px solid #d0d0d0;background:#fff;color:#1b1b1b;border-radius:999px;width:30px;height:30px;padding:0}
.site .sbtn{border:0;border-radius:10px;padding:14px;color:#fff;font-weight:700;font-size:15px;width:100%}
.site .sbtn:disabled{opacity:.4}
.site .sfoot{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid #ececec;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.site input{border:1px solid #cfcfcf;border-radius:8px;padding:12px;font:inherit;font-size:16px;width:100%;color:#1b1b1b;background:#fff}
.site label{font-size:13px;font-weight:600;color:#444}
.site .srow{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;color:#333}
.site .pw{font-size:11px;color:#888;text-align:center;padding:10px 0 4px}
.site .conf{padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.site .conf .ck{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:28px}
.capture{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;background:var(--ok-bg);color:var(--ink);border-radius:14px;padding:10px 12px;margin:12px 16px 0}
.capture img{width:36px;height:36px}
.capture span{font-size:13px;color:var(--muted)}
.push-banner{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:70;width:calc(100% - 24px);max-width:420px;display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;text-align:left;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.push-banner img{width:38px;height:38px;border-radius:9px;background:#121212;padding:2px}
.push-banner .t{display:flex;flex-direction:column;gap:1px;min-width:0}
.push-banner .t small{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.push-banner .t span{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.push-banner{animation:drop .35s ease-out}@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}}
.oitem{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.oitem img,.oitem .noimg{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--soft);display:grid;place-items:center}
.oitem .noimg img{width:36px;height:36px;object-fit:contain;background:none;opacity:.8}
.oitem .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.oitem .t span{font-size:12px;color:var(--muted)}
.oitem .t b{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.addbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:22px;line-height:1;display:grid;place-items:center;padding:0}
.cartbar{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));margin:0 calc(-1*max(20px,env(safe-area-inset-right,0px))) calc(-22px - env(safe-area-inset-bottom,0px));padding:12px max(20px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.tips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tips button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 4px;font-weight:600;font-size:14px}
.tips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.steps div{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.steps i{height:5px;border-radius:3px;background:var(--line)}
.steps div.on{color:var(--ink)}.steps div.on i{background:var(--gold)}
.steps div.done i{background:var(--ok)}
.ordercard{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:var(--soft);border-radius:18px;padding:12px;border:0;width:100%;text-align:left}
.ordercard img{width:64px;height:64px;border-radius:12px;object-fit:cover}
.ordercard .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.bignum{font-family:var(--display);font-size:64px;line-height:.9;color:var(--gold-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}

/* Three Empires additions */
.tapart{display:grid;place-items:center;width:100%;aspect-ratio:1;max-width:100%;border-radius:14px;background:radial-gradient(120% 90% at 50% 100%,color-mix(in srgb,var(--bc) 45%,#121212) 0%,#121212 72%);box-shadow:var(--shadow)}
.tapart svg{width:42%;height:auto}
.tapart svg path:first-child{stroke:rgba(255,255,255,.35)}
.byof{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:#121212;color:#f4f1eb;border-radius:20px;padding:14px;border:0;width:100%;text-align:left}
.byof img{width:96px;height:96px}
.byof .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.byof h2{color:#f4f1eb}
.byof p{font-size:13px;color:#cfc8bb}
.byof .tag{color:#77c240}
.byof.big{grid-template-columns:1fr;justify-items:center;text-align:center;padding:22px 18px}
.byof.big img{width:140px;height:140px}
.linkbtn{border:0;background:none;padding:0;color:var(--gold-ink);font-weight:600;font:inherit;text-decoration:underline}
.fb .btn.gold{background:#77c240;color:#121212}
nav.tabs .in{grid-template-columns:repeat(4,1fr)}
.qa{color:inherit}
.photo.visit .cap h1{color:#fff}
</style>
