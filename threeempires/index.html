const UT={"updated": "2026-11-01", "tap": [{"id": "7186248", "name": "The Blonde", "style": "Blonde / Golden Ale - American", "abv": 5.2, "ibu": 23.0, "rating": 0.0, "raters": "2 Ratings", "desc": "", "color": "#efd24c", "grp": "Ales", "added": "10/09/26"}, {"id": "6944357", "name": "RD39", "style": "IPA - American", "abv": 6.0, "ibu": 24.0, "rating": 0.0, "raters": "3 Ratings", "desc": "", "color": "#d99a26", "grp": "IPAs", "added": "09/26/26"}, {"id": "6837466", "name": "Stone Hazy", "style": "IPA - New England / Hazy", "abv": 6.8, "ibu": 34.0, "rating": 0.0, "raters": "2 Ratings", "desc": "", "color": "#e8b13a", "grp": "IPAs", "added": "08/21/26"}, {"id": "6820350", "name": "Flying Fs Smash English Ale", "style": "Pale Ale - English", "abv": 5.8, "ibu": 38.0, "rating": 0.0, "raters": "8 Ratings", "desc": "", "color": "#d99a26", "grp": "Ales", "added": "08/07/26"}, {"id": "6751062", "name": "Naughty By Nature", "style": "IPA - New England / Hazy", "abv": 5.98, "ibu": 24.0, "rating": 0.0, "raters": "9 Ratings", "desc": "", "color": "#e8b13a", "grp": "IPAs", "added": "06/13/26"}, {"id": "5566228", "name": "Juicy Booty - Hazy IPA", "style": "IPA - New England / Hazy", "abv": 5.6, "ibu": 44.0, "rating": 3.55, "raters": "312 Ratings", "desc": "It's so juicy, you'll wanna squeeze it! Our blend of pilsner malt, white wheat and flaked oats give this beer a sweet, malty, bready character while being full-bodied in flavor and creamy in texture. And talk about juicy...the addition of 4 different hops (Citra, Galaxy, El Dorado & Ekaunot) give it a perfect punch of citrus! Sooooo juicy!!", "color": "#e8b13a", "grp": "IPAs", "added": "10/14/23"}, {"id": "5675215", "name": "Midnight Creeper", "style": "IPA - Black / Cascadian Dark Ale", "abv": 8.0, "ibu": 109.0, "rating": 3.73, "raters": "81 Ratings", "desc": "Brewed with 3 lbs of hops; our blend of Centennial, CTZ and Simcoe is sure to leave an impressive bite with 109 IBU's....a real treat for the hop head! This blend of hops provides a funky pine complex aroma and pleasant citrus zest with a clean bitterness of earthy and spicy characteristics. The chocolate malt provides the dark color and flavors of roasted coffee and cocoa.", "color": "#1f0b05", "grp": "IPAs", "added": "01/09/24"}, {"id": "5733075", "name": "Frisco Blonde 2.0", "style": "Blonde / Golden Ale - American", "abv": 5.0, "ibu": 21.0, "rating": 3.27, "raters": "51 Ratings", "desc": "Our second version of Frisco Blonde. This time we switched up the hops to Hallertau Blanc. Hallertau Blanc is a new German variety with a bouquet of sweet and tropical fruits, but what makes it so distinctive is a unique white wine character. We are working on a third version but please let us know your thoughts on Frisco Blonde 2.0!", "color": "#efd24c", "grp": "Ales", "added": "03/01/24"}, {"id": "5547529", "name": "Amber’s First Time", "style": "Red Ale - American Amber / Red", "abv": 4.8, "ibu": 26.0, "rating": 3.52, "raters": "180 Ratings", "desc": "", "color": "#8a3a14", "grp": "Ales", "added": "09/30/23"}, {"id": "6424976", "name": "Sweater Weather Seltzer", "style": "Hard Seltzer", "abv": 5.5, "ibu": null, "rating": 0.0, "raters": "3 Ratings", "desc": "Remember Cabana Boy, our tropical hard seltzer packed with passion fruit, peach, strawberry, and orange? Well, he’s back — but this time he’s swapped the swim trunks for a sweater. Still fruity, fun, and a little flirty, Sweater Weather keeps the tropical vibes alive with a crisp, cozy finish made for fall.", "color": "#f3efd8", "grp": "Seltzers", "added": "09/26/25"}], "vault": [{"id": "5737157", "name": "Black Hole Sun", "style": "Schwarzbier", "abv": 5.5, "ibu": 23.0, "rating": 3.98, "raters": "56 Ratings", "desc": "Often referred to as a \"black pilsner\", this is a Schwarzbier, a bewitching brew that captivates the senses. This lager pours a deep, mysterious black hue with glimmers of ruby at the edges, hinting at the cosmic depths within. As you raise the glass, aromas of roasted malts and coffee dance gracefully, enticing you to explore further. It is a celestial libation that beckons you to explore the mysteries of the universe, one sip at a time.", "color": "#1f0b05", "grp": "Lagers", "added": "03/04/24"}, {"id": "6114487", "name": "Rise & Grinder", "style": "Stout - Coffee", "abv": 5.1, "ibu": 36.0, "rating": 3.96, "raters": "41 Ratings", "desc": "We collaborated with La Finca coffee right here in the Rail District for this delicious brew! We hand selected the coffee bean, Mazateca Mujeres, from Sierra Mazateca which happens to be an all female produced coffee bean from a farm in Oaxaca Mexico. The result is a rich and indulgent beer that combines the deep, roasted flavors of coffee with the creamy sweetness of chocolate. The stout base offers a smooth, velvety mouthfeel, with notes of dark malt and subtle hints of caramel. The coffee adds an earthy, robust bitterness, while the chocolate brings a lush sweetness that balances the bitterness perfectly.", "color": "#1f0b05", "grp": "Stouts", "added": "12/30/24", "collab": "Collab with La Finca Coffee in the Rail District"}, {"id": "5764663", "name": "Spring Fling Pale Ale", "style": "Pale Ale - American", "abv": 6.4, "ibu": 35.0, "rating": 3.93, "raters": "37 Ratings", "desc": "Indulge in the vibrant essence of the season with our 'Spring Fling Pale Ale.' Crafted with a meticulous blend of premium malts and infused with the enchanting aroma of Mosaic hops, this hazy IPA bursts with lively citrus notes, reminiscent of a blossoming orchard in springtime. Embrace the allure of the season with every pour of this tantalizing brew.", "color": "#d8a530", "grp": "Ales", "added": "03/26/24"}, {"id": "6003926", "name": "Save the Tatas 2024", "style": "Sour - Fruited", "abv": 6.3, "ibu": 11.0, "rating": 3.91, "raters": "20 Ratings", "desc": "Brewed in honor of Breast Cancer Awareness Month and the owner of Three Empires Brewing Co. who is a breast cancer survivor, Save the Tatas 2024 is sure to delight with a vibrant explosion of flavor! This refreshing brew bursts with juicy notes of ripe blueberries, tart raspberries, boysenberry and succulent strawberries, harmonizing beautifully with a light, tart base", "color": "#c2454f", "grp": "Sours", "added": "10/01/24", "collab": "Brewed for Breast Cancer Awareness Month"}, {"id": "5704494", "name": "Gimme Samoa 'Dat Cookie", "style": "Stout - Pastry", "abv": 6.7, "ibu": 36.0, "rating": 3.9, "raters": "63 Ratings", "desc": "It's Girl Scout cookie season so what better way to enjoy the delightful Samoa cookie than with a cookie infused beer! We took our Dirty South Stout recipe but switched it up by adding 6 boxes of Samoa cookies to the mash and Woodford Reserve bourbon soaked cocoa nibs to the secondary fermentation. Delicious!", "color": "#1f0b05", "grp": "Stouts", "added": "02/06/24"}, {"id": "5593361", "name": "Sticky Fingers Peanut Butter Stout", "style": "Stout - Other", "abv": 6.0, "ibu": 36.0, "rating": 3.82, "raters": "150 Ratings", "desc": "Peanut butter lovers rejoice! If you liked our Dirty South Stout, be sure to get yourself a pint of sticky fingers! Brewed with chocolate malt, coconuts and peanut butter. This beers full of flavor! A decadent delight!", "color": "#1f0b05", "grp": "Stouts", "added": "11/04/23"}, {"id": "5619410", "name": "Die Hard - A Christmas Ale", "style": "Winter Ale", "abv": 7.6, "ibu": 27.0, "rating": 3.82, "raters": "52 Ratings", "desc": "Estimated Release for our Christmas in July Party is Saturday 7/20. So is Die Hard a Christmas movie or not? Well, we will let y'all discuss that amongst yourselves :-) One thing is for certain, this IS a Christmas Ale! A combination of caramel malt, white wheat, special roast malt & roasted barley with the addition of fresh ginger root, cinnamon sticks & local honey give this beer lots of holiday flavor!", "color": "#b0601f", "grp": "Ales", "added": "11/24/23"}, {"id": "5953297", "name": "DCW Anniversary Beer", "style": "IPA - American", "abv": 7.4, "ibu": 72.0, "rating": 3.82, "raters": "19 Ratings", "desc": "Brewed for our one year anniversary on September 30th this American IPA offers a refreshing twist on the classic IPA. This brew features a base of Pilsner malt, lending a light, clean foundation that lets the vibrant Mosaic hops shine. Expect an aromatic bouquet of tropical fruit, with notes of ripe mango & juicy pineapple. The flavor profile is both crisp and complex, offering a burst of citrus zest, subtle pine, and a whisper of earthy undertones. The finish is delightfully dry and clean, perfect for those who appreciate a hop-forward IPA with a refreshing edge.", "color": "#d99a26", "grp": "IPAs", "added": "08/20/24"}, {"id": "6623254", "name": "The Darker the Berry the Sweeter the Juice", "style": "Porter - Blackberry", "abv": 5.5, "ibu": 32.0, "rating": 3.81, "raters": "14 Ratings", "desc": "Blackberry forward bonanza, dancing as it hits your lips, juicy on the tongue with a fruity finish. Enjoy!", "color": "#1f0b05", "grp": "Stouts", "added": "03/06/26"}, {"id": "6392560", "name": "Backhoe Bitter IPA", "style": "IPA - American", "abv": 6.8, "ibu": 60.0, "rating": 3.8, "raters": "12 Ratings", "desc": "They say nothing builds character quite like construction, and in downtown Frisco, we’ve got plenty of both. Born from the dust, detours, and the sweet sound of jackhammers outside our taproom, Backhoe Bitter is our way of raising a pint to perseverance. When the dust won’t settle, we brew something that will. Backhoe Bitter IPA digs deep with bold hop character. A golden-amber IPA with bold hops, citrus and tropical notes, balanced by a sturdy malt backbone. Crisp, complex, and clean with a firm, refreshing finish.", "color": "#d99a26", "grp": "IPAs", "added": "08/28/25"}, {"id": "6316745", "name": "Summer Fling 2025", "style": "Wheat Beer - American Pale Wheat", "abv": 5.3, "ibu": null, "rating": 3.79, "raters": "13 Ratings", "desc": "A delightful brew that boasts a bright, hazy appearance and offers a burst of tropical fruit flavors, featuring notes of mango, pineapple, and hints of citrus. The smooth, wheat base provides a light and crisp mouthfeel, making it the perfect companion for warm days and carefree moments.", "color": "#f2dc7a", "grp": "Ales", "added": "06/25/25"}, {"id": "5681914", "name": "Holy Trinity", "style": "IPA - Imperial / Double", "abv": 9.4, "ibu": 150.0, "rating": 3.76, "raters": "38 Ratings", "desc": "Several people were influential in creating hip hop music. However, the most notable pioneers are DJ Kool Herc (Clive Cambell), Afrika Bambaataa, and Grandmaster Flash. These three innovators are known as the “Holy Trinity” of hip hop. We brewed this beer in honor of black history month and the legacy they created. Brewed with 6 pounds of hops combining the complex characters of Simcoe, CTZ & Centennial!", "color": "#d99a26", "grp": "IPAs", "added": "01/16/24"}, {"id": "6314643", "name": "R&D 37", "style": "Fruit Beer", "abv": 5.0, "ibu": 29.0, "rating": 3.74, "raters": "15 Ratings", "desc": "Stone fruit Peach and Strawberry notes", "color": "#e07a4a", "grp": "Sours", "added": "06/22/25"}, {"id": "5764674", "name": "Cowboy Tears Serrano Pale Ale", "style": "Pale Ale - American", "abv": 5.7, "ibu": 43.0, "rating": 3.73, "raters": "44 Ratings", "desc": "This ale embodies the rugged charm of the Wild West with a fiery kick that'll leave you longing for more. The initial burst of citrus and pine from the hops sets the stage for the main event: the unmistakable heat of Serrano peppers. So grab your hat, tip your glass, and raise a toast to the untamed spirit of the West. With every sip, you'll taste the essence of cowboy courage and the bittersweet beauty of the frontier.", "color": "#d8a530", "grp": "Ales", "added": "03/26/24"}, {"id": "6114493", "name": "\"Just the Tip\" of the Iceberg", "style": "IPA - Cold", "abv": 7.1, "ibu": 81.0, "rating": 3.71, "raters": "26 Ratings", "desc": "A Cold IPA featuring Galaxy, Nugget, and CTZ hops is a crisp, aromatic, and vibrant beer that delivers a fresh, hop-forward experience. The cold fermentation process enhances the clean, smooth profile, allowing the bold hop character to shine without the usual heaviness. Offering a crisp, refreshing mouthfeel with a dry finish, showcasing a well-rounded blend of fruity, piney, and slightly spicy hop notes, makes this perfect for those who enjoy a hop-forward beer with a clean, smooth finish.", "color": "#d99a26", "grp": "IPAs", "added": "12/30/24"}, {"id": "5764834", "name": "Hot & Bothered Strawberry Blonde Ale", "style": "Blonde / Golden Ale - American", "abv": 5.4, "ibu": 21.0, "rating": 3.69, "raters": "38 Ratings", "desc": "A refreshing and light-bodied beer that combines the crispness of a traditional blonde ale with the subtle sweetness and tartness of fresh strawberries. This unique brew offers a delightful balance of flavors, making it an excellent choice for those seeking a fruity twist on a classic style.", "color": "#efd24c", "grp": "Ales", "added": "03/26/24"}, {"id": "5600602", "name": "D's Nuts Brown Ale", "style": "Brown Ale - American", "abv": 4.6, "ibu": 23.0, "rating": 3.66, "raters": "34 Ratings", "desc": "Brewed with caramel, chocolate & brown malt our pecan nut brown ale gives you smooth flavors of sweet toffee, caramel, rich roasted coffee and cocoa with a slight nuttiness of pecans. The Willamette hops provide an earthy, spicy character with floral and fruity notes.", "color": "#5a2a10", "grp": "Ales", "added": "11/10/23"}, {"id": "5619485", "name": "Smash & Dasher", "style": "IPA - American", "abv": 7.1, "ibu": 50.0, "rating": 3.63, "raters": "37 Ratings", "desc": "You know Dasher and Dancer and Prancer and Vixen...Comet and Cupid and Donner and Blitzen....this holiday beer is brewed with Vienna Malt & COMET hops. Comet is zesty with grapefruit and tangerine, but is backed by some unique grassy and herbal elements. We balance that with Vienna malt which is sweet, malty and bready with a hint of biscuit.", "color": "#d99a26", "grp": "IPAs", "added": "11/24/23"}, {"id": "6424973", "name": "Rail District Ultra Light", "style": "Lager - American Light", "abv": 4.2, "ibu": 10.0, "rating": 3.6, "raters": "23 Ratings", "desc": "The Construction Crew’s Break Beer! Light, crisp, and smoother than a freshly paved road (not like downtown). It’s the kind of easy-drinking lager that helps you forget about orange cones and closed streets.", "color": "#efd24c", "grp": "Lagers", "added": "09/26/25"}, {"id": "5566124", "name": "Tangerine Speedo", "style": "IPA - American", "abv": 6.8, "ibu": 44.0, "rating": 3.6, "raters": "86 Ratings", "desc": "It takes confidence to rock a Tangerine Speedo, so order one with pride! The caramel malt creates a candy-like sweetness with a mild caramel flavor while the Waimea hops are bursting with fresh tangelo, citrus fruit and pine needle character.", "color": "#d99a26", "grp": "IPAs", "added": "10/14/23"}, {"id": "6696019", "name": "Main Street Maibock", "style": "Bock - Hell / Maibock / Lentebock", "abv": 7.1, "ibu": 28.0, "rating": 3.59, "raters": "14 Ratings", "desc": "", "color": "#b0601f", "grp": "Lagers", "added": "05/02/26", "collab": "Collab with Rollertown Beerworks, just down Main Street"}, {"id": "5547551", "name": "Steps Day", "style": "Pale Ale - American", "abv": 5.9, "ibu": 43.0, "rating": 3.59, "raters": "92 Ratings", "desc": "A vibrant brew inspired by the lively spirit of Rush day at Stephen F. Austin State University. Crafted with a blend of Simcoe, Citra, and Cascade hops, this pale ale boasts a harmonious dance of citrus, pine, and tropical fruit flavors. Embark on a flavorful journey with each sip, as the dynamic hops mirror the excitement of fraternity Rush day, making this beer a perfect companion for memorable moments and camaraderie.", "color": "#d8a530", "grp": "Ales", "added": "09/30/23"}, {"id": "6114499", "name": "Ruff Warlock's Revenge", "style": "Pale Ale - American", "abv": 6.1, "ibu": 25.0, "rating": 3.58, "raters": "67 Ratings", "desc": "This pale ale features a crisp malt base of Pilsner, Maris Otter, and Vienna malts, offering a light, biscuity sweetness with a touch of toasty complexity. Centennial hops deliver floral, citrus notes, while Mosaic hops add vibrant tropical fruit flavors of mango and pineapple. Balanced with moderate bitterness, it’s a refreshing, flavorful brew with a clean finish.", "color": "#d8a530", "grp": "Ales", "added": "12/30/24"}, {"id": "5695944", "name": "\"Blanche\" Raspberry White Ale", "style": "Wheat Beer - Witbier / Blanche", "abv": 5.4, "ibu": 15.0, "rating": 3.58, "raters": "133 Ratings", "desc": "We call this Raspberry infused version of our Betty White Ale the \"Blanche\". By adding raspberry syrup we create a flavor profile similar to a Framboise...a belgian style beer fermented with raspberries. It's delightful!!", "color": "#f2dc7a", "grp": "Ales", "added": "01/29/24"}, {"id": "5764670", "name": "The Last JedIPA", "style": "IPA - American", "abv": 6.7, "ibu": 61.0, "rating": 3.55, "raters": "36 Ratings", "desc": "Estimated Release Date: April 20th. Brewed in honor of May the 4th be with you, this beer transports you to a galaxy far, far away with every sip. Crafted with a blend of Falconer's Flight and Galaxy hops, this brew embodies the adventurous spirit of the Millennium Falcon soaring through the cosmos. It greets the senses with an enticing aroma of tropical fruits, citrus zest, and hints of pine. On the palate, this intergalactic elixir delivers a balanced yet bold flavor profile. So raise your glass, toast to adventure, and may the force be with you as you explore the universe one sip at a time.", "color": "#d99a26", "grp": "IPAs", "added": "03/26/24"}, {"id": "5945250", "name": "Smash & Dash", "style": "IPA - American", "abv": 6.9, "ibu": 69.0, "rating": 3.53, "raters": "37 Ratings", "desc": "A single malt, single hop IPA brewed with Citra. The Citra hop imparts vibrant citrus and tropical fruit flavors. With just one malt variety, the malt profile is clean and straightforward, allowing the Citra hop's flavors and aromas to shine prominently. The result is a crisp, refreshing IPA with a bold and distinct hop character, moderate bitterness and a balanced, drinkable finish.", "color": "#d99a26", "grp": "IPAs", "added": "08/13/24"}, {"id": "5737139", "name": "Cabana Boy Seltzer", "style": "Hard Seltzer", "abv": 5.0, "ibu": null, "rating": 3.52, "raters": "17 Ratings", "desc": "A mix of passion fruit, peach, strawberry and orange this tropical seltzer will have you longing for a day at the beach or pool!", "color": "#f3efd8", "grp": "Seltzers", "added": "03/04/24"}, {"id": "5593182", "name": "Irish Red Rocket", "style": "Red Ale - Irish", "abv": 5.5, "ibu": 19.0, "rating": 3.46, "raters": "36 Ratings", "desc": "Our signature blend of roasted barley and special bee gives this recipe a signature toasty and sweet aroma and flavor. The addition of EKG hops adds a sweet, spicy, floral aroma. The color is not a traditional Irish red, but more a darker Amber ale. Sound", "color": "#8a3a14", "grp": "Ales", "added": "11/04/23"}, {"id": "6289134", "name": "Thirst Trap", "style": "IPA - New England / Hazy", "abv": 7.0, "ibu": 47.0, "rating": 3.45, "raters": "31 Ratings", "desc": "This isn’t just a hazy IPA — it’s a full-blown Thirst Trap. Juicy, smooth, and dripping with tropical allure, this brew is made to turn heads and break hearts. Built with a bold blend of Simcoe, Mosaic, Idaho, and Citra hops, it’s packed with notes of mango, pineapple, citrus, and just enough bitterness to keep things interesting.", "color": "#e8b13a", "grp": "IPAs", "added": "06/02/25"}, {"id": "5547746", "name": "Betty White Ale", "style": "Wheat Beer - Witbier / Blanche", "abv": 5.4, "ibu": 15.0, "rating": 3.45, "raters": "223 Ratings", "desc": "Betty White...what can we say...she's an American Icon with so much character- and that's exactly what this beer is! Our Betty White Ale is full-bodied in flavor with a creamy function renderChrome(){
 $('#hdr').innerHTML=`<img class="logo ink" src="${IMG.word_ink}" alt="Three Empires Brewing Co."><img class="logo white" src="${IMG.word_white}" alt="Three Empires Brewing Co.">
  <div class="hdr-r"><a class="ibtn" href="tel:${BIZ.tel}" aria-label="Call the brewery">${ico('phone')}</a><button class="ibtn" data-act="theme" aria-label="${isDark()?'Switch to light mode':'Switch to dark mode'}">${ico(isDark()?'sun':'moon')}</button></div>`;
 $('#tabs').innerHTML=TABS.map(([k,l,ic])=>`<button data-tab="${k}" ${S.tab===k?'aria-current="page"':''}>${ico(ic)}${l}</button>`).join('');
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.tab)});
function go(t,extra){S.tab=t;Object.assign(S,extra||{});closeSheet();render();scrollTo(0,0)}

/* ---------- views ---------- */
function todayHtml(){const off=S.dayOff,d=addDays(today,off),dow=d.getDay(),w=WEEKLY[dow],h=HOURS[dow];
 const kick=off===0?(now.getHours()>=16?'Tonight':'Today'):off===1?'Tomorrow':DOW[dow]+', '+MON[d.getMonth()]+' '+d.getDate();
 const strip=[...Array(7)].map((_,i)=>{const x=addDays(today,i);return `<button class="dchip" data-act="tday" data-v="${i}" aria-pressed="${off===i}"><small>${i===0?'Today':DOW[x.getDay()]}</small><b>${x.getDate()}</b><i class="${WEEKLY[x.getDay()]?'on':''}"></i></button>`}).join('');
 const card=w?`<button class="hcard badge" data-act="happen" data-v="${dow}"><img class="hzb" src="${IMG[w.img]}" alt=""><span class="shade"></span><span class="cap"><span class="k">${esc(kick)} · Free</span><b>${esc(w.name)}</b><span class="s">${w.when}</span><span class="go">Details</span></span></button>`
  :h?`<button class="hcard" data-act="tab" data-v="beer"><img class="bgi sharp" src="${IMG.beers}" alt=""><span class="shade"></span><span class="cap"><span class="k">${esc(kick)}</span><b>Taproom open</b><span class="s">${fmtH(h[0])} – ${fmtH(h[1])} · bring your own food</span><span class="go">See the beers</span></span></button>`
  :`<button class="hcard" data-act="tab" data-v="visit"><img class="bgi sharp" src="${IMG.hero}" alt=""><span class="shade"></span><span class="cap"><span class="k">${esc(kick)}</span><b>Closed</b><span class="s">The taproom is open Thursday through Sunday</span><span class="go">Hours</span></span></button>`;
 return `<div class="stack"><h2>What’s happening</h2><div class="dstrip" role="group" aria-label="Pick a day">${strip}</div><div class="hcards">${card}</div></div>`}

function vHome(){const o=openState();
 const feats=[
  {k:'Most checked-in',title:'Juicy Booty',body:'Their hazy IPA, the most-rated Three Empires beer on Untappd.',img:'beers',v:'5566228'},
  {k:'Breast Cancer Awareness',title:'Save the Tatas',body:'A fruited sour brewed in honor of co-owner Mandy, a breast cancer survivor.',img:'party',v:'6003926'},
  {k:'Rail District collab',title:'Rise & Grinder',body:'Coffee stout made with La Finca Coffee.',img:'beers',v:'6114487'},
  {k:'Collab on Main Street',title:'Main Street Maibock',body:'Brewed with Rollertown Beerworks.',img:'hero',v:'6696019'}
 ];
 return `<section class="view" style="gap:30px">
  <div class="stack" style="gap:12px">
   <h1>Frisco’s first brewery</h1>
   <button class="statusline" data-act="tab" data-v="visit"><span class="status ${o.open?'':'off'}">${o.txt}</span><span class="addr">${BIZ.addr}, Frisco</span>${ico('chev')}</button>
   <p class="muted">Family-owned nanobrewery in the historic Ford Building in the Rail District. Every beer is brewed on site.</p>
  </div>
  <div class="quick">
   <button class="qa" data-act="tab" data-v="beer"><span class="ic">${ico('menu')}</span>Beers</button>
   <button class="qa" data-act="tab" data-v="events"><span class="ic">${ico('trivia')}</span>Trivia &amp; bingo</button>
   <a class="qa" href="${BIZ.maps}" target="_blank" rel="noopener" style="text-decoration:none"><span class="ic">${ico('pin')}</span>Directions</a>
   <a class="qa" href="tel:${BIZ.tel}" style="text-decoration:none"><span class="ic">${ico('phone')}</span>Call</a>
  </div>
  ${todayHtml()}
  <div class="stack"><h2>Recently poured <button class="more" data-act="tab" data-v="beer">All beers</button></h2>
   <div class="rail">${RECENT.map(b=>`<button class="tapc" data-act="beer" data-v="${b.id}">${tapArt(b)}<h3>${esc(b.name)}</h3><span class="small muted">${esc(b.style.split(' - ')[0])} · ${b.abv!=null?b.abv+'%':''}</span></button>`).join('')}</div>
  </div>
  <div class="stack"><h2>Featured beers</h2><div class="rail">${feats.map(f=>`<button class="feat" data-act="beer" data-v="${f.v}"><div class="im"><img src="${IMG[f.img]}" alt=""></div><span class="k">${esc(f.k)}</span><h3>${esc(f.title)}</h3><p>${esc(f.body)}</p></button>`).join('')}</div></div>
  <button class="byof" data-act="tab" data-v="visit"><img src="${IMG.b_food}" alt=""><div class="t"><span class="tag">No food served</span><h2>Bring your own food</h2><p>The brewery doesn’t serve food, and you’re welcome to bring your own.</p></div></button>
  <button class="photo visit" data-act="tab" data-v="visit" style="border:0;padding:0;width:100%;text-align:left"><img src="${IMG.ford}" alt="Illustration of the Ford Building"><div class="shade"></div>
   <div class="cap"><span class="status ${o.open?'':'off'}">${o.txt}</span><h2>Plan your visit</h2><p>Hours, directions and the story behind the name</p></div></button>
  ${foot()}
 </section>`}

function vBeer(){
 const groups=['All','Lagers','IPAs','Stouts','Sours','Ales','Seltzers'];
 const src=S.view==='recent'?RECENT:PAST;
 const q=S.q.trim().toLowerCase();
 let list=src.filter(b=>(S.filter==='All'||b.grp===S.filter)&&(!q||(b.name+' '+b.style).toLowerCase().includes(q)));
 if(S.view==='past')list=[...list].sort(S.sort==='az'?(a,b)=>a.name.localeCompare(b.name):S.sort==='abv'?(a,b)=>(b.abv||0)-(a.abv||0):(a,b)=>b.rating-a.rating);
 const row=b=>`<button class="r" data-act="beer" data-v="${b.id}">${art(b)}<div class="t"><h3>${esc(b.name)}</h3><span>${esc(b.style)}</span><span class="row" style="gap:10px">${b.rating?`<span class="rate">${ico('star')}${b.rating.toFixed(2)}</span>`:''}${b.collab?'<span class="tag">Collab</span>':''}</span></div><div class="abv"><b>${b.abv!=null?b.abv.toFixed(1)+'%':'—'}</b><span>${b.ibu!=null?b.ibu+' IBU':''}</span></div></button>`;
 return `<section class="view" style="gap:20px"><h1>Beer</h1>
  <div class="photo banner"><img src="${IMG.beers}" alt="Illustration of pints on a bar"><div class="shade"></div><div class="cap"><h1>Brewed on site</h1><p>Ales, IPAs, stouts and seltzers</p></div></div>
  <div class="seg2" role="group" aria-label="Beer list"><button data-act="view" data-v="recent" aria-pressed="${S.view==='recent'}">Recently poured · ${RECENT.length}</button><button data-act="view" data-v="past" aria-pressed="${S.view==='past'}">Brewed before · ${PAST.length}</button></div>
  <div class="src"><span class="dot"></span><span>${S.view==='recent'?`Newest releases and beers checked in on draft at the taproom, from Untappd as of <b>${MON[UPDATED.getMonth()]} ${UPDATED.getDate()}</b>. Ask at the bar for today’s taps.`:'Every other beer Three Empires has listed on Untappd since 2023.'}</span></div>
  ${S.view==='past'?`<div class="search"><input id="bq" type="search" placeholder="Search ${PAST.length} beers" value="${esc(S.q)}" aria-label="Search beers"><select id="bsort" aria-label="Sort"><option value="rating" ${S.sort==='rating'?'selected':''}>Top rated</option><option value="az" ${S.sort==='az'?'selected':''}>A–Z</option><option value="abv" ${S.sort==='abv'?'selected':''}>Strongest</option></select></div>`:''}
  <div class="chips">${groups.filter(g=>g==='All'||src.some(b=>b.grp===g)).map(g=>`<button data-act="filter" data-v="${g}" aria-pressed="${S.filter===g}">${g}</button>`).join('')}</div>
  <div class="rows">${list.map(row).join('')||'<p class="muted" style="padding:14px 0">No beers match.</p>'}</div>
  <p class="small muted">Beer details and ratings from <a href="${BIZ.untappd}" target="_blank" rel="noopener">Three Empires on Untappd</a>. 21+ to drink. Never drink and drive.</p>
 </section>`}

function vEvents(){
 return `<section class="view">
  <div class="photo banner"><img src="${IMG.party}" alt="Illustration of pints raised under string lights"><div class="shade"></div><div class="cap"><h1>Events</h1><p>Weekly and free</p></div></div>
  <div class="stack"><h2>Every week</h2><div class="rows">${[4,5].map(d=>{const w=WEEKLY[d];return `<button class="r" data-act="happen" data-v="${d}"><img class="thumb" src="${IMG[w.img]}" alt=""><div class="t"><span class="tag">${w.kicker}</span><h3>${w.name}</h3><span>${w.when} · free</span></div><svg class="chev" viewBox="0 0 24 24" aria-hidden="true">${ICON.chev}</svg></button>`}).join('')}</div></div>
  <div class="stack"><h2>Also at the brewery</h2><div class="rows">${EXTRAS.map(([img,n,s])=>`<a class="r" href="${BIZ.ig}" target="_blank" rel="noopener" style="text-decoration:none"><img class="thumb" src="${IMG[img]}" alt=""><div class="t"><h3>${n}</h3><span>${s}</span></div><svg class="chev" viewBox="0 0 24 24" aria-hidden="true">${ICON.ext}</svg></a>`).join('')}</div></div>
  <div class="fb"><img src="${IMG.roundel}" alt=""><div class="stack" style="gap:6px"><h2>Save the Tatas</h2><p>Brewed for Breast Cancer Awareness Month in honor of co-owner Mandy Wible, a breast cancer survivor.</p><button class="btn sm gold" data-act="beer" data-v="6003926" style="align-self:flex-start">See the beer</button></div></div>
  ${foot()}
 </section>`}

function vVisit(){const o=openState();
 return `<section class="view">
  <div class="photo visit"><img src="${IMG.ford}" alt="Illustration of the Ford Building"><div class="shade"></div><div class="cap"><span class="status ${o.open?'':'off'}">${o.txt}</span><h1>Three Empires Brewing Co.</h1><p>${BIZ.addr}, ${BIZ.city}</p></div></div>
  <div class="g2b"><a class="btn gold" href="${BIZ.maps}" target="_blank" rel="noopener">${ico('pin')}Directions</a><a class="btn line" href="tel:${BIZ.tel}">${ico('phone')}${BIZ.phone}</a></div>
  <div class="rows">
   <div class="info">${ico('clock')}<div><b>Hours</b><div class="hours">${[1,2,3,4,5,6,0].map(d=>`<span class="${d===now.getDay()?'now':''}">${DOW[d]}</span><span class="${d===now.getDay()?'now':''}">${HOURS[d]?fmtH(HOURS[d][0])+' – '+fmtH(HOURS[d][1]):'Closed'}</span>`).join('')}</div><span class="small muted">Listings differ on Friday and Saturday opening times. Call before a special trip.</span></div></div>
   <div class="info">${ico('bag')}<div><b>Bring your own food</b><span class="muted">Food isn’t served, and you’re welcome to bring your own.</span></div></div>
   <div class="info">${ico('trivia')}<div><b>Trivia Thursdays · Music Bingo Fridays</b><span class="muted">Both 7 – 9p and free.</span></div></div>
   <div class="info">${ico('tour')}<div><b>Private events</b><span class="muted">The taproom is listed for private event rentals. Call the brewery to ask about dates and pricing.</span></div></div>
  </div>
  <div class="stack"><h2>Our story</h2>
   <div class="story"><div class="im"><img src="${IMG.owners}" alt="Owners Mandy and David Wible"></div><div class="im"><img src="${IMG.hero}" alt=""></div></div>
   <p class="muted" style="font-size:14px">Three Empires is owned by David and Mandy Wible. The name is for their family of three and the little family empire they wanted to build. Mandy creates the recipes, and David brews every beer on site.</p>
   <div class="tl"><b>2014</b><span>A first attempt at opening a brewery, in Houston.</span><b>2019</b><span>A second attempt begins in Frisco. That deal folds in 2022.</span><b>2023</b><span>Frisco City Council approves the brewery in March, and the taproom soft-opens on September 30 in the 1911 Ford Building as Frisco’s first brewery.</span></div>
  </div>
  <div class="stack"><h2>Shop</h2><div class="more2">
   <a href="${BIZ.shop}" target="_blank" rel="noopener"><div class="im"><img src="${IMG.merch}" alt=""></div><h3>Merch</h3><p>The Three Empires online store.</p></a>
   <a href="${BIZ.gift}" target="_blank" rel="noopener"><div class="im"><img src="${IMG.hero}" alt=""></div><h3>Gift cards</h3><p>The Frisco Rail District Community Card is accepted here.</p></a>
  </div></div>
  <div class="stack" style="gap:8px"><span class="label">Follow along</span><div class="g2b"><a class="btn line" href="${BIZ.ig}" target="_blank" rel="noopener">${ico('ext')}Instagram</a><a class="btn line" href="${BIZ.fb}" target="_blank" rel="noopener">${ico('ext')}Facebook</a></div><a class="btn line block" href="${BIZ.untappd}" target="_blank" rel="noopener">${ico('ext')}Untappd</a></div>
  <div class="stack" style="gap:8px"><span class="label">Get home safe</span><div class="g2b"><a class="btn line" href="https://m.uber.com/ul/?action=setPickup&pickup=my_location" target="_blank" rel="noopener">${ico('ride')}Uber</a><a class="btn line" href="https://ride.lyft.com/" target="_blank" rel="noopener">${ico('ride')}Lyft</a></div></div>
  ${foot()}
 </section>`}

function foot(){return `<p class="foot">App concept for Three Empires Brewing Co. Logo from their Square store. Beers from Untappd. Hours, events and story from Visit Frisco, Community Impact and local event listings. Images other than the owners’ photo are illustrations made from the logo.</p>`}

/* ---------- sheets ---------- */
function beerSheet(id){const b=beer(id),rec=isRecent(id);
 sheet(`<div class="bigglass">${art(b,84)}<div class="stack" style="gap:4px;min-width:0;flex:1"><span class="tag ${rec?'ok':''}">${rec?'Recently poured':'Brewed before'}</span><h1 style="font-size:30px">${esc(b.name)}</h1><span class="small muted">${esc(b.style)}</span></div></div>
 ${b.collab?`<span class="tag">${esc(b.collab)}</span>`:''}
 ${b.desc?`<p class="desc">${esc(b.desc)}</p>`:'<p class="desc muted">No description listed on Untappd.</p>'}
 <div class="specs"><div><b class="num">${b.abv!=null?b.abv+'%':'—'}</b><span>ABV</span></div><div><b class="num">${b.ibu!=null?b.ibu:'—'}</b><span>IBU</span></div><div><b class="num">${b.rating?b.rating.toFixed(2):'—'}</b><span>UNTAPPD</span></div></div>
 <p class="small muted">${esc(b.raters)} on Untappd${b.added?' · added '+esc(b.added):''}</p>
 <a class="btn gold block" href="https://untappd.com/beer/${b.id}" target="_blank" rel="noopener">View on Untappd</a>
 <button class="btn line block" data-act="close">Done</button>`)}
function happeningSheet(dow){const w=WEEKLY[dow],dates=nextDates(+dow,4);
 sheet(`<div class="hz badge"><img class="hzb" src="${IMG[w.img]}" alt=""><div class="hzcap"><span class="k">${w.kicker.toUpperCase()} · FREE</span><h1>${esc(w.name)}</h1></div></div>
 ${chips([['cal',w.kicker],['clock',w.when],['star','Free']])}
 <p class="desc">${esc(w.desc)}</p>
 <div class="stack" style="gap:8px"><span class="label">Coming up</span><div class="ndates">${dates.map((d,i)=>`<div class="nd ${i===0?'on':''}"><small>${i===0&&+dow===now.getDay()?'TONIGHT':DOW[d.getDay()].toUpperCase()}</small><b>${d.getDate()}</b><small>${MON[d.getMonth()].toUpperCase()}</small></div>`).join('')}</div></div>
 <p class="small muted">Food isn’t served, so bring dinner. Schedules can change, so check Instagram or Facebook for holiday weeks.</p>
 <div class="g2b"><button class="btn gold" data-act="ics" data-v="${dow}">${ico('cal')}Add to calendar</button><a class="btn line" href="${BIZ.maps}" target="_blank" rel="noopener">${ico('pin')}Directions</a></div>`)}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v;
 if(a==='close'){if(e.target===el||el.tagName==='BUTTON')closeSheet();return}
 if(a==='tab'){const x={};if(v==='beer'){x.view='recent';x.filter='All'}return go(v,x)}
 if(a==='theme')return flipTheme();
 if(a==='tday'){S.dayOff=+v;return render()}
 if(a==='happen')return happeningSheet(+v);
 if(a==='ics'){ics(+v);return toast('Calendar file downloaded')}
 if(a==='beer')return beerSheet(v);
 if(a==='view'){S.view=v;S.filter='All';S.q='';return render()}
 if(a==='filter'){S.filter=v;return render()}
});
document.addEventListener('input',e=>{if(e.target.id==='bq'){S.q=e.target.value;const pos=e.target.selectionStart;render();const i=$('#bq');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='bsort'){S.sort=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheetRoot').innerHTML)closeSheet()});
function render(){renderChrome();$('#app').innerHTML=({home:vHome,beer:vBeer,events:vEvents,visit:vVisit}[S.tab])()}
render();
</script>
</body>
</html>
